<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Tapaki Track - 3D Map</title>
  <!-- Mengimpor model-viewer dari Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: system-ui, -apple-system, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .ar-button {
      background-color: #2e7d32;
      border-radius: 25px;
      border: none;
      color: white;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      z-index: 99;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ar-button:active {
      background-color: #1b5e20;
    }

    /* Menyembunyikan tombol AR bawaan model-viewer agar custom button kita yang tampil */
    model-viewer::part(default-ar-button) {
      display: none;
    }
  </style>
</head>

<body>
  <!-- 
    src: URL model 3D (GLB) di server aaPanel Anda
    ios-src: URL model 3D (USDZ) khusus untuk pengguna iPhone/iOS (siapkan jika rilis di App Store nanti)
  -->
  <model-viewer src="https://ridwan226.github.io/bookcashly.github.io/tapaki/3dmaps/mount-rinjani/mount-rinjani.glb"
    ios-src="https://ridwan226.github.io/bookcashly.github.io/tapaki/3dmaps/mount-rinjani/mount-rinjani.usdz" ar
    ar-modes="scene-viewer webxr quick-look" ar-scale="auto" ar-placement="floor" camera-controls tone-mapping="neutral"
    shadow-intensity="1" auto-rotate rotation-per-second="30deg">
    <!-- Custom AR Button -->
    <button slot="ar-button" class="ar-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      Lihat dalam AR (Kamera)
    </button>

  </model-viewer>
</body>

</html>
